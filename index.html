<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aussie Tackle - Clan Battle Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #082d34;
      --panel-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-green: #16a34a;
      --accent-cyan: #0284c7;
      --accent-gold: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: linear-gradient(rgba(13, 70, 80, 0.88), rgba(8, 45, 52, 0.95)), #082d34; color: var(--text-main); padding: 20px; min-height: 100vh; }
    .container { max-width: 850px; margin: 0 auto; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .brand-text { color: #fff; font-weight: 800; font-size: 1.1rem; }
    .brand-sub { color: #cbd5e1; font-size: 0.75rem; }

    .card {
      background: var(--panel-bg); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card-title { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; margin-bottom: 14px; color: #0f172a; display: flex; align-items: center; gap: 8px; }

    .section-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #cbd5e1; margin-bottom: 8px; }

    .map-grid, .var-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .select-btn {
      background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s ease;
    }
    .select-btn:hover { border-color: var(--accent-cyan); background: #f1f5f9; }
    .select-btn.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3); }

    .discord-box {
      background: #0e121b; border: 1px solid #283448; border-radius: 12px; padding: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #e2e8f0;
      white-space: pre-wrap; word-break: break-word; min-height: 140px; line-height: 1.6; margin-bottom: 14px;
    }
    .copy-btn {
      width: 100%; background: #5865F2; color: #fff; border: none; padding: 12px;
      border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
    }
    .copy-btn:hover { background: #404eed; }
    .loading { text-align: center; color: #cbd5e1; padding: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div>
        <div class="brand-text">AUSSIE TACKLE</div>
        <div class="brand-sub">Clan Battle Chat Generator (GitHub Pages)</div>
      </div>
      <button onclick="fetchData()" class="select-btn" style="background: rgba(255,255,255,0.1); color:#fff; border:none;">
        <i class="fa-solid fa-arrows-rotate"></i> Sync
      </button>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-map-location-dot text-success"></i> 1. Pilih Lokasi Map</div>
      <div class="map-grid" id="mapGrid">
        <div class="loading">Memuat data map dari Spreadsheet...</div>
      </div>

      <div class="section-label">Pilih Variasi Battle</div>
      <div class="var-grid" id="varGrid">
        <div style="color:var(--text-muted); font-size:0.85rem;">Pilih map terlebih dahulu</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-comment-dots"></i> 2. Hasil Format Chat Pengumuman</div>
      <div class="discord-box" id="discordText">Menghubungkan ke Spreadsheet...</div>
      <button class="copy-btn" id="copyBtn" onclick="copyDiscordAnnouncement()">
        <i class="fa-regular fa-copy"></i> Salin Teks Chat
      </button>
    </div>
  </div>

  <script>
    // Ganti URL di bawah ini dengan URL Web App Google Apps Script kamu
    const API_URL = 'MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DISINI';

    let masterFishData = [];
    let calendarData = [];
    let currentMap = '';
    let currentVariation = '';

    window.onload = function() {
      fetchData();
    };

    function fetchData() {
      const mapGrid = document.getElementById('mapGrid');
      mapGrid.innerHTML = '<div class="loading">Menyinkronkan data...</div>';

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            alert("Error: " + data.message);
            return;
          }
          masterFishData = data.masterData || [];
          calendarData = data.calendarData || [];
          renderMaps();
        })
        .catch(err => {
          alert("Gagal terhubung ke API Spreadsheet: " + err.message);
          mapGrid.innerHTML = '<div class="loading" style="color:#ff4d6d;">Koneksi Gagal! Periksa URL API.</div>';
        });
    }

    function renderMaps() {
      const maps = [...new Set(masterFishData.map(item => item.map).filter(Boolean))];
      const mapGrid = document.getElementById('mapGrid');
      
      if (maps.length === 0) {
        mapGrid.innerHTML = '<div class="loading">Tidak ada data di tab Master Data!</div>';
        return;
      }

      mapGrid.innerHTML = maps.map((mapName, idx) => `
        <button class="select-btn ${idx === 0 ? 'active' : ''}" onclick="selectMap('${mapName}', this)">${mapName}</button>
      `).join('');

      if (maps.length > 0) selectMap(maps[0], mapGrid.children[0]);
    }

    function selectMap(mapName, btn) {
      currentMap = mapName;
      document.querySelectorAll('#mapGrid .select-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      const variations = [...new Set(
        masterFishData
          .filter(i => (i.map || '').trim().toLowerCase() === mapName.toLowerCase())
          .map(i => i.variation || 'Standard')
      )];

      const varGrid = document.getElementById('varGrid');
      varGrid.innerHTML = variations.map((varName, idx) => `
        <button class="select-btn ${idx === 0 ? 'active' : ''}" onclick="selectVariation('${varName}', this)">${varName}</button>
      `).join('');

      if (variations.length > 0) selectVariation(variations[0], varGrid.children[0]);
    }

    function selectVariation(varName, btn) {
      currentVariation = varName;
      document.querySelectorAll('#varGrid .select-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      generateChatOutput();
    }

    function generateChatOutput() {
      const filtered = masterFishData.filter(item => 
        item.map.toLowerCase() === currentMap.toLowerCase() &&
        (item.variation || 'Standard').toLowerCase() === currentVariation.toLowerCase()
      );

      let text = `:crossed_swords: **New Clan Battle** :crossed_swords:\n\n:map: **${currentMap}** (${currentVariation})\n\n`;

      if (filtered.length === 0) {
        text += `☀️🌙🗓️✅ Tidak ada data ikan khusus.\n\n`;
      } else {
        filtered.forEach(f => {
          text += `• **${f.fish}**\n`;
          if (f.activeTime && f.activeTime !== 'Day & Night') {
            text += `  _Waktu: ${f.activeTime}_\n`;
          }
          if (f.status && f.status.toLowerCase().includes('out')) {
            text += `  _Status: Out of Season_ 🗓️\n`;
          }
        });
      }

      const mapLink = filtered.length > 0 ? filtered[0].mapLink : '';
      if (mapLink) text += `\n🔗 ${mapLink}`;

      document.getElementById('discordText').innerText = text.trim();
    }

    function copyDiscordAnnouncement() {
      const text = document.getElementById('discordText').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Berhasil Disalin!';
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin Teks Chat';
        }, 2000);
      });
    }
  </script>
</body>
</html>
